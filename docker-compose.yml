services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5000}
      FUZZY_QUEST_SECRET: ${FUZZY_QUEST_SECRET:?Configure FUZZY_QUEST_SECRET in .env}
      FUZZY_QUEST_DB: /app/instance/fuzzy_quest.sqlite3
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      MAIL_FROM: ${MAIL_FROM:-noreply@fuzzy-quest.local}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    volumes:
      - fuzzy_quest_data:/app/instance

volumes:
  fuzzy_quest_data:
