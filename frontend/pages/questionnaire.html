<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5145cd">
    <title>Questionnaire · FUZZY-QUEST</title>
    <link rel="stylesheet" href="/css/answer.css">
</head>
<body class="answer-page">
    <header class="answer-header">
        <a class="answer-brand" href="/" aria-label="FUZZY-QUEST">
            <img src="/LOGO_FQ.png" alt="">
            <span><b>FUZZY-QUEST</b><small>Quest For Truth</small></span>
        </a>
    </header>
    <main class="answer-shell">
        <div id="loadError" class="answer-message" role="alert" hidden></div>
        <form id="responseForm" hidden>
            <section class="answer-intro">
                <span class="answer-eyebrow">QUESTIONNAIRE</span>
                <h1 id="qTitle">Chargement…</h1>
                <p id="qDescription"></p>
            </section>
            <section class="respondent-card" aria-labelledby="respondentTitle">
                <div class="anonymous-row">
                    <div><h2 id="respondentTitle">Votre réponse</h2><p>Vous pouvez répondre sans indiquer votre identité.</p></div>
                    <label class="toggle-label"><input id="anonymousMode" type="checkbox" checked><span>Répondre anonymement</span></label>
                </div>
                <div id="identityFields" class="identity-fields" hidden>
                    <label>Nom et prénom<input id="respondentName" name="name" autocomplete="name" maxlength="160" placeholder="Votre nom"></label>
                    <label>Adresse e-mail<input id="respondentEmail" name="email" type="email" autocomplete="email" maxlength="254" placeholder="vous@exemple.com"></label>
                </div>
            </section>
            <div id="questionList" class="answer-questions"></div>
            <div id="answerError" class="answer-message" role="alert" hidden></div>
            <button id="sendBtn" class="answer-submit" type="submit">Envoyer mes réponses</button>
            <p class="answer-footnote">Vos réponses sont enregistrées de manière sécurisée.</p>
        </form>
        <div id="loading" class="answer-loading">Chargement du questionnaire…</div>
    </main>
    <script src="/js/auth.js"></script>
    <script src="/js/questionnaire-api.js"></script>
</body>
</html>
