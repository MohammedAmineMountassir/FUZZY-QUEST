<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Créer un mot de passe · FUZZY-QUEST</title>
        <link rel="stylesheet" href="../css/public.css">
    </head>
    <body class="public-site">
        <header class="public-header">
            <a class="public-brand" href="/connexion.html">
                <img src="../logo.jpeg" alt=""><span><b>FUZZY-QUEST</b><small>Beyond yes and no</small></span>
            </a>
            <a class="text-link" href="/connexion.html">
                Accueil
            </a>
        </header>
        <main class="flow-page">
            <section class="flow-card">
                <span class="eyebrow">SÉCURISATION DU COMPTE</span>
                <h1 id="passwordTitle">
                    Créer votre mot de passe
                </h1>
                <p id="passwordIntro">
                    Choisissez un mot de passe d’au moins 8 caractères avec une lettre et un chiffre.
                </p>
                <form id="passwordForm">
                    <div class="alertbox" id="passwordAlert">
                    </div>
                    <label>
                        Nouveau mot de passe<input id="newPassword" type="password" minlength="8" required autocomplete="new-password">
                    </label>
                    <label>
                        Confirmer le mot de passe<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password">
                    </label>
                    <button class="button primary full">Valider</button>
                </form>
            </section>
        </main>
        <script src="../js/auth.js">
        </script>
        <script src="../js/password-flow.js">
        </script>
    </body>
</html>
